# Rafraichit chaque nuit le bloc RESULTATS de index.html depuis la base de
# production (secret DATABASE_URL). Ne commit que s'il y a un changement.
name: update-results

on:
  schedule:
    - cron: "15 4 * * *"   # 04h15 UTC = 06h15 Paris, apres le bilan de minuit
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Sans le secret DATABASE_URL, on sort proprement (pas d'echec nocturne).
    # Le jour ou le secret est ajoute dans Settings > Secrets > Actions,
    # le rafraichissement demarre tout seul, rien d'autre a faire.
    steps:
      - name: Check secret
        id: gate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Secret DATABASE_URL absent : rafraichissement desactive (aucune erreur)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.present == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install psycopg2
        if: steps.gate.outputs.present == 'true'
        run: pip install psycopg2-binary
      - name: Regenerate results block
        if: steps.gate.outputs.present == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/update_results.py index.html
      - name: Commit and push if changed
        if: steps.gate.outputs.present == 'true'
        run: |
          git config user.name "gbet-results-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet index.html; then
            echo "Aucun changement"
            exit 0
          fi
          git add index.html
          git commit -m "Resultats du jour (auto)"
          # Retry sur rejet du push (05/08/2026, meme fix que sync-site-public.yml
          # dans le repo prive) : ce repo a plusieurs ecrivains (sync depuis
          # sports-bot-pro, publications en temps reel via l'API Contents) qui
          # peuvent pousser au meme moment -- fetch + rebase + nouvel essai
          # plutot que d'attendre le prochain declenchement.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "[Retry] push rejete (tentative $attempt/5), pull --rebase puis nouvel essai..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "[Retry] rebase impossible (conflit reel) -- abandon."
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "[Retry] push toujours rejete apres 5 tentatives -- abandon."
          exit 1
